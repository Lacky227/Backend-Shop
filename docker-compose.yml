version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: shop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: userDB
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - "luckyshop-net"
    restart: always

  mongodb:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - "luckyshop-net"
    restart: always

  rabbitmq:
    image: rabbitmq:4.1.2-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    networks:
      - "luckyshop-net"
    restart: always

  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=duckdns"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.delayBeforeCheck=60"
      - "--certificatesresolvers.myresolver.acme.email=tishko.artyr@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    environment:
      - DUCKDNS_TOKEN=a3ed416a-186f-4e81-af36-0b7d125c96a8
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - "luckyshop-net"
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  auth-service:
    build:
      context: authservice
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userDB
      SPRING_DATASOURCE_USERNAME: shopuser
      SPRING_DATASOURCE_PASSWORD: shoppass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GOOGLE_API_URL: https://www.googleapis.com/oauth2/v1/userinfo
      SPRING_JACKSON_SERIALIZATION_INDENT_OUTPUT: true
      SECRET_KEY: 3F1F6A0A2B4E6F8C9D0E11223344556677889900AABBCCDDEEFF001122334455
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: rabbituser
      SPRING_RABBITMQ_PASSWORD: rabbitpass
      SERVER_PORT: 8081
    networks:
      - luckyshop-net
    restart: always

  api-gateway:
    build:
      context: apigateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      - auth-service
      - rabbitmq
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`gw-retail.duckdns.org`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=myresolver"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    ports:
      - "8080:8080"
    networks:
      - "luckyshop-net"
    restart: always

  notification-service:
    build:
      context: notificationservice
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      - mongodb
      - rabbitmq
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/notificationDB
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: notification.veedev@gmail.com
      SPRING_MAIL_PASSWORD: rkbd gocy uawr bohf
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
      NOTIFICATION_TOKEN_SECRET: OLi2DbABssc0WNyE62FAA1Sx7mnroEhb
      NOTIFICATION_EMAIL_BASE_UNSUB_URL: https://lucky-shop-one.vercel.app/unsubscribe
      NOTIFICATION_EMAIL_BASE_FORGOT_PASSWORD_URL: https://lucky-shop-one.vercel.app/auth/create-new-password
      SECRET_KEY: 3F1F6A0A2B4E6F8C9D0E11223344556677889900AABBCCDDEEFF001122334455
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: rabbituser
      SPRING_RABBITMQ_PASSWORD: rabbitpass
      SERVER_PORT: 8083
    networks:
      - "luckyshop-net"
    restart: always

  product-service:
    build:
      context: productservice
      dockerfile: Dockerfile
    container_name: product-service
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productdb
      SPRING_DATASOURCE_USERNAME: shopuser
      SPRING_DATASOURCE_PASSWORD: shoppass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      CLOUDINARY_CLOUD_NAME: dnc6uzrjr
      CLOUDINARY_API_KEY: 136367972677619
      CLOUDINARY_API_SECRET: RxCQD1JGeNZRoxxVDc6RbQtiXRA
      SERVER_PORT: 8082
    networks:
      - "luckyshop-net"
    restart: always

volumes:
  pgdata:
  mongodata:

networks:
  luckyshop-net:
    name: luckyshop-network
    driver: bridge