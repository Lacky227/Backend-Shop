name: Deploy to Google VM

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clear Maven Cache
        run: rm -rf $HOME/.m2/repository

      - name: Build auth-service
        run: |
          cd authservice
          ls -l src/main/java
          grep -r "local.name.directory" . || echo "No local.name.directory in authservice"
          mvn clean package -DskipTests --debug || echo "Maven build failed for auth-service"
          mv target/*.jar ../auth-service.jar
          ls -l ../auth-service.jar

      - name: Build api-gateway
        run: |
          cd apigateway
          ls -l src/main/java
          grep -r "local.name.directory" . || echo "No local.name.directory in apigateway"
          mvn clean package -DskipTests --debug || echo "Maven build failed for api-gateway"
          mv target/*.jar ../api-gateway.jar
          ls -l ../api-gateway.jar

      - name: Build notification-service
        run: |
          cd notificationservice
          ls -l src/main/java
          grep -r "local.name.directory" . || echo "No local.name.directory in notificationservice"
          mvn clean package -DskipTests --debug || echo "Maven build failed for notification-service"
          mv target/*.jar ../notification-service.jar
          ls -l ../notification-service.jar

      - name: Build product-service
        run: |
          cd productservice
          ls -l src/main/java
          grep -r "local.name.directory" . || echo "No local.name.directory in productservice"
          mvn clean package -DskipTests --debug || echo "Maven build failed for product-service"
          mv target/*.jar ../product-service.jar
          ls -l ../product-service.jar

      - name: Upload project files to VM via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          rm: true # Видаляє цільову директорію перед копіюванням
          source: ".,auth-service.jar,api-gateway.jar,notification-service.jar,product-service.jar,docker-compose.yml"
          target: "/home/${{ secrets.VM_USER }}/Backend-Shop"

      - name: Run docker-compose on VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          script: |
            rm -rf /home/${{ secrets.VM_USER }}/Backend-Shop
            mkdir -p /home/${{ secrets.VM_USER }}/Backend-Shop
            cd /home/${{ secrets.VM_USER }}/Backend-Shop
            docker-compose down
            docker system prune -f --volumes
            if [ -f "./letsencrypt/acme.json" ]; then
              chmod 600 ./letsencrypt/acme.json
            else
              mkdir -p ./letsencrypt
              touch ./letsencrypt/acme.json
              chmod 600 ./letsencrypt/acme.json
            fi
            docker-compose up --build -d