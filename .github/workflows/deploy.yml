name: Deploy to Google VM

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build auth-service
        run: |
          cd authservice
          mvn clean package -DskipTests
          mv target/*.jar ../auth-service.jar

      - name: Build api-gateway
        run: |
          cd apigateway
          mvn clean package -DskipTests
          mv target/*.jar ../api-gateway.jar

      - name: Build notification-service
        run: |
          cd notificationservice
          mvn clean package -DskipTests
          mv target/*.jar ../notification-service.jar

      - name: Build product-service
        run: |
          cd productservice
          mvn clean package -DskipTests
          mv target/*.jar ../product-service.jar

      - name: Upload project files to VM via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          source: ".,auth-service.jar,api-gateway.jar,notification-service.jar,product-service.jar,docker-compose.yml"
          target: "/home/${{ secrets.VM_USER }}/Backend-Shop"

      - name: Run docker-compose on VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}/Backend-Shop
            docker-compose down
            docker system prune -f --volumes
            if [ -f "./letsencrypt/acme.json" ]; then
              chmod 600 ./letsencrypt/acme.json
            else
              mkdir -p ./letsencrypt
              touch ./letsencrypt/acme.json
              chmod 600 ./letsencrypt/acme.json
            fi
            docker-compose up --build -d